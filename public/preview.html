    // --- SAMPLE JOBS ---

    // --- HEURISTIC DETECTOR ENGINE ---
    // Positive legitimacy signals that REDUCE the score
    const LEGITIMACY_SIGNALS = [
      { regex: /(phone\s*screen|technical\s*(assessment|interview|coding)|on-?\s*site\s*(panel|interview)|virtual\s*on-?\s*site|interview\s*process\s*:?\s*\d)/i, deduction: 15, label: 'Structured interview process' },
      { regex: /@[a-zA-Z0-9-]+\.(com|org|io|co|net|ai|dev)\b(?!.*(gmail|yahoo|hotmail|outlook|live|protonmail|aol))/i, deduction: 10, label: 'Corporate domain email' },
      { regex: /(health\s*insurance|401\s*k|equity|stock\s*options|RSU|PTO|paid\s*time\s*off|dental|vision\s*coverage|retirement\s*plan)/i, deduction: 10, label: 'Standard benefits package' },
      { regex: /(equal\s*opportunity\s*employer|EEO|diversity\s*(and|&)\s*inclusion|we\s*do\s*not\s*charge\s*any\s*fee)/i, deduction: 10, label: 'EEO or no-fee disclaimer' },
      { regex: /(\d+\+?\s*years?\s*(of\s*)?(experience|exp)|bachelor'?s?\s*degree|master'?s?\s*degree|computer\s*science)/i, deduction: 5, label: 'Specific professional requirements' },
    ];

    const SCAM_INDICATORS = [
      {
        category: 'Financial Red Flags',
        severity: 'critical',
        weight: 35,
        regex: /(cashier['\u2019]?s\s*check|send\s*(a\s*)?check|wire\s*transfer|zelle|cash\s*app|venmo|western\s*union|moneygram|purchase\s*(this\s*|the\s*)?equipment|certified\s*vendor|vendor\s*via\s*wire|training\s*fee|registration\s*fee|pay\s*for\s*(your\s*)?(background\s*check|software|tools)|pay\s*(?:rs\.?|\u20b9|INR)\s*\d|pay\s*\$?\d+\s*(as\s*(a\s*)?)?fee|pay\s*before\s*joining|verification\s*fee|processing\s*fee|security\s*deposit\s*for\s*job)/i,
        title: 'Advance-Fee / Equipment Purchasing Scheme Detected',
        reason: 'The posting mentions mailing checks or requiring the applicant to transfer money/purchase equipment from a "vendor", or demands registration/verification/training fees. Legitimate employers NEVER require candidates to pay money upfront.',
        recommendation: 'NEVER deposit a check from a prospective employer to buy equipment or transfer funds. NEVER pay registration, verification, or training fees. This is the classic "Fake Check / Advance-Fee Scam".',
        scanDescriptionOnly: false,
      },
      {
        category: 'Cryptocurrency & Untraceable Assets',
        severity: 'high',
        weight: 25,
        regex: /(cryptocurrency|bitcoin|btc|usdt|usdc|ethereum|metamask|phantom\s*wallet|crypto\s*wallet|test\s*wallet|smart\s*contract\s*trial)/i,
        title: 'Cryptocurrency / Non-Custodial Wallet Requirement',
        reason: 'Job requires interactions with crypto wallets, smart contracts, or payment exclusively in tokens/USDT. Common in crypto task fraud, unauthorized drainers, or unlicensed MLM operations.',
        recommendation: 'Do not connect your personal cryptocurrency wallets to unverified portals or accept payment exclusively in untraceable crypto assets.',
        scanDescriptionOnly: true,
      },
      {
        category: 'Communication Channels',
        severity: 'medium',
        weight: 10,
        regex: /(interview\s*(only\s*)?(via|through|on)\s*(telegram|whatsapp|signal)|contact\s*(us\s*)?(only\s*)?(via|through|on)\s*(telegram|whatsapp)|telegram\s*(only|interview|screening)|whatsapp\s*(only|interview|screening)|chat\s*screening\s*only)/i,
        title: 'Text-Only Interview on Informal Messaging App',
        reason: 'Hiring process appears to be conducted solely through Telegram, WhatsApp, or other informal text chat apps. Verified corporate enterprises use corporate email systems and verified video conferences.',
        recommendation: 'Legitimate corporate companies do not interview candidates exclusively via Telegram or WhatsApp text messages. Request a formal corporate video conference and an official company email address.',
        scanDescriptionOnly: true,
      },
      {
        category: 'Email Domain Verification',
        severity: 'medium',
        weight: 10,
        regex: /(@gmail\.com|@yahoo\.com|@hotmail\.com|@outlook\.com|@live\.com|@protonmail\.com|@aol\.com)/i,
        title: 'Free Public Webmail Used for Recruiting',
        reason: "The contact email uses a free webmail service (Gmail, Yahoo, Hotmail, etc.) rather than a verified company domain. Established businesses typically use domain-authenticated email.",
        recommendation: "Check the sender\u2019s email domain against the company\u2019s official registered website. If a large corporation uses a Gmail address as its only contact, treat it with caution.",
        scanDescriptionOnly: false,
        contextWeight: true,
      },
      {
        category: 'Compensation Anomaly',
        severity: 'medium',
        weight: 15,
        regex: /(no\s*experience\s*(needed|required).*\$?\d{2,}|no\s*degree\s*needed|earn\s*\$?[4-9]\d{2,}\s*(per\s*day|weekly)|(\$([5-9]\d|\d{3})\s*(per|\/)\s*hour.*data\s*entry)|guaranteed\s*income|instant\s*wealth|earn\s*lakhs?\s*per\s*month\s*from\s*home)/i,
        title: 'Unrealistic Pay for Entry-Level or Zero-Experience Role',
        reason: 'Offering extraordinarily high compensation for generic, entry-level, or zero-experience tasks is a notorious scammer hook.',
        recommendation: 'Compare the offered salary with standard industry benchmarks. Disproportionately high pay for low-skilled tasks indicates high fraud probability.',
        scanDescriptionOnly: true,
      },
      {
        category: 'Linguistic & Urgency Red Flags',
        severity: 'medium',
        weight: 12,
        regex: /(kindly\s*(provide|send|add|reach|contact|fill|deposit)|immediate\s*(start|hiring|tomorrow)|hired\s*(on\s*the\s*spot|instantly)|no\s*interview\s*(needed|required)|confidential\s*task|urgent\s*opening|contact\s*(our\s*)?recruiter\s*(through|via)\s*whatsapp\s*immediately|you\s*will\s*receive\s*your\s*joining\s*letter\s*after\s*payment)/i,
        title: 'Artificial Urgency & Scam Dialect Markers',
        reason: 'Repeated use of linguistic indicators like "Kindly", immediate hiring without substantive screening, or rushing the candidate to start or pay within 24 hours.',
        recommendation: 'Be cautious of rush tactics. Real hiring teams require credential checks, interview debriefs, and standard background verification timeframes.',
        scanDescriptionOnly: true,
      },
      {
        category: 'Sensitive Information & Identity Theft',
        severity: 'critical',
        weight: 30,
        regex: /(ssn|social\s*security\s*number|driver['\u2019]?s\s*license\s*(front\s*and\s*back|copy)|passport\s*photo|bank\s*(login|credentials|account\s*details\s*for\s*verification)|date\s*of\s*birth\s*before\s*offer)/i,
        title: 'Premature Request for Sensitive Identity or Banking Data',
        reason: "Demanding sensitive identity documents (SSN, Passport, Driver\u2019s license photos, banking credentials) prior to a signed formal employment contract.",
        recommendation: 'Never send copies of government IDs, Social Security Numbers, or banking login credentials via email or chat.',
        scanDescriptionOnly: true,
      },
      {
        category: 'Package Reshipping / Mule',
        severity: 'critical',
        weight: 35,
        regex: /(receive\s*packages?\s*(at\s*home|at\s*your\s*address)|repack\s*and\s*(forward|ship)|reship|package\s*(forwarding|handler|processor)\s*job|shipping\s*coordinator\s*from\s*home)/i,
        title: 'Package Reshipping / Mule Ring Scheme',
        reason: 'The posting describes receiving, repackaging, and forwarding parcels from home. This is a known criminal mule operation often involving stolen goods.',
        recommendation: 'Legitimate employers never ask employees to receive and reship packages from their personal home address. This is a federal crime.',
        scanDescriptionOnly: true,
      },
    ];

    function runDetection(jobData) {
      const descriptionText = jobData.description || '';
      const metadataText = [
        jobData.title || '',
        jobData.company || '',
        jobData.contact || '',
        jobData.salary || '',
      ].join(' \n ');

      const detectedPhrases = new Set();
      const detectedReasons = [];
      let rawScore = 0;

      // Scan indicators against the appropriate text
      for (const indicator of SCAM_INDICATORS) {
        const textToScan = indicator.scanDescriptionOnly ? descriptionText : (descriptionText + ' \n ' + metadataText);
        const match = textToScan.match(indicator.regex);
        if (match) {
          let weight = indicator.weight;
          // If contextWeight flag: reduce weight if match is only in metadata, not description
          if (indicator.contextWeight && !descriptionText.match(indicator.regex)) {
            weight = Math.round(weight * 0.4);
          }
          rawScore += weight;
          const snippet = match[0].trim();
          detectedPhrases.add(snippet);
          detectedReasons.push({
            category: indicator.category,
            severity: indicator.severity,
            title: indicator.title,
            description: indicator.reason,
            recommendation: indicator.recommendation,
            triggerPhrase: snippet,
          });
        }
      }

      // Apply positive legitimacy signal deductions (scan full text)
      const fullText = descriptionText + ' \n ' + metadataText;
      let legitimacyDeduction = 0;
      for (const signal of LEGITIMACY_SIGNALS) {
        if (fullText.match(signal.regex)) {
          legitimacyDeduction += signal.deduction;
        }
      }
      rawScore = Math.max(0, rawScore - legitimacyDeduction);

      // Cap: if NO critical or high severity indicators fired, cap at 45
      const hasCriticalOrHigh = detectedReasons.some(r => r.severity === 'critical' || r.severity === 'high');
      if (!hasCriticalOrHigh && rawScore > 45) {
        rawScore = 45;
      }

      const fraudScore = Math.min(100, Math.max(0, rawScore));
      let category = 'Low';
      let color = 'emerald';
      let label = 'Low Risk';

      if (fraudScore >= 65) {
        category = 'High';
        color = 'red';
        label = 'High Fraud Risk';
      } else if (fraudScore >= 30) {
        category = 'Medium';
        color = 'amber';
        label = 'Moderate Risk';
      }

      const recommendations = [];
      if (category === 'High') {
        recommendations.push({ priority: 'CRITICAL', text: 'Do NOT send any money, buy equipment, or deposit checks sent by this sender.' });
        recommendations.push({ priority: 'CRITICAL', text: 'Cease communication immediately if they insist on text interviews via Telegram or WhatsApp.' });
        recommendations.push({ priority: 'HIGH', text: 'Report this job posting to the FTC (reportfraud.ftc.gov) or FBI IC3 (ic3.gov).' });
      } else if (category === 'Medium') {
        recommendations.push({ priority: 'HIGH', text: 'Verify the company corporate registration via state business registries.' });
        recommendations.push({ priority: 'MEDIUM', text: 'Search for the recruiter on LinkedIn and confirm their official domain email.' });
        recommendations.push({ priority: 'MEDIUM', text: 'Insist on a two-way video interview before providing any information.' });
      } else {
        recommendations.push({ priority: 'INFO', text: 'Posting exhibits standard corporate hiring signals. Always double-check email domains.' });
        recommendations.push({ priority: 'INFO', text: 'Ensure tax documents (W-4, I-9) are submitted through encrypted corporate portals only.' });
      }

      return {
        id: 'rep_' + Date.now(),
        jobTitle: jobData.title || 'Untitled Job Posting',
        company: jobData.company || 'Unspecified Organization',
        contact: jobData.contact || 'N/A',
        interviewChannel: jobData.interviewChannel || 'Standard',
        salary: jobData.salary || 'Unspecified',
        originalDescription: jobData.description || '',
        fraudScore,
        riskCategory: category,
        riskColor: color,
        riskLabel: label,
        suspiciousPhrases: Array.from(detectedPhrases),
        reasons: detectedReasons,
        safetyRecommendations: recommendations,
        analyzedAt: new Date().toISOString(),
        engineMode: 'Client Heuristic Engine (Frontend Architecture Preview)',
      };
    }

    // --- APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('scanner');
      const [formData, setFormData] = useState({
        title: '',
        company: '',
        contact: '',
        interviewChannel: 'standard',
        salary: '',
        description: '',
      });
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [currentReport, setCurrentReport] = useState(null);
      const [history, setHistory] = useState([]);
      const [isSaved, setIsSaved] = useState(false);
      const [isTipsOpen, setIsTipsOpen] = useState(false);
      const [selectedHistoryItem, setSelectedHistoryItem] = useState(null);
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        try {
          const raw = localStorage.getItem('ai_fake_job_detector_history');
          if (raw) setHistory(JSON.parse(raw));
        } catch (e) {}
      }, []);

      const saveHistory = (report) => {
        const updated = [report, ...history.filter(h => h.id !== report.id)].slice(0, 50);
        setHistory(updated);
        setIsSaved(true);
        try {
          localStorage.setItem('ai_fake_job_detector_history', JSON.stringify(updated));
        } catch (e) {}
      };

      const deleteHistoryItem = (id) => {
        const updated = history.filter(h => h.id !== id);
        setHistory(updated);
        try {
          localStorage.setItem('ai_fake_job_detector_history', JSON.stringify(updated));
        } catch (e) {}
      };

      const [backendStatus, setBackendStatus] = useState('checking'); // 'connected' | 'missing_key' | 'offline' | 'checking'
      const [backendError, setBackendError] = useState(null);
      const [loadingStage, setLoadingStage] = useState('');
      const [isRechecking, setIsRechecking] = useState(false);
      const [recheckMessage, setRecheckMessage] = useState('');
      const [apiKeyInput, setApiKeyInput] = useState('');
      const [isSavingKey, setIsSavingKey] = useState(false);

      // Dynamic backend URL for local & production (Render, Vercel)
      const getDefaultApiUrl = () => {
        try {
          const urlParam = new URLSearchParams(window.location.search).get('api');
          if (urlParam) return urlParam.replace(/\/$/, '');
        } catch (e) {}
        try {
          const savedUrl = localStorage.getItem('ai_fake_job_detector_api_url');
          if (savedUrl) return savedUrl.replace(/\/$/, '');
        } catch (e) {}
        if (window.BACKEND_API_URL) return window.BACKEND_API_URL.replace(/\/$/, '');
        return 'http://127.0.0.1:8000';
      };

      const [apiBaseUrl, setApiBaseUrl] = useState(getDefaultApiUrl());
      const [isApiSettingsOpen, setIsApiSettingsOpen] = useState(false);
      const [apiUrlInput, setApiUrlInput] = useState(getDefaultApiUrl());

      const handleSaveApiUrl = (e) => {
        e.preventDefault();
        const trimmed = apiUrlInput.trim().replace(/\/$/, '');
        if (!trimmed) return;
        localStorage.setItem('ai_fake_job_detector_api_url', trimmed);
        setApiBaseUrl(trimmed);
        setIsApiSettingsOpen(false);
        setRecheckMessage(`API URL switched to: ${trimmed}`);
        setTimeout(() => setRecheckMessage(''), 4000);
      };

      const handleResetApiUrl = () => {
        localStorage.removeItem('ai_fake_job_detector_api_url');
        setApiBaseUrl('http://127.0.0.1:8000');
        setApiUrlInput('http://127.0.0.1:8000');
        setIsApiSettingsOpen(false);
        setRecheckMessage('API URL reset to local default (http://127.0.0.1:8000)');
        setTimeout(() => setRecheckMessage(''), 4000);
      };

      // Check FastAPI backend health
      const checkBackendHealth = async (isManual = false) => {
        if (isManual) setIsRechecking(true);
        try {
          const res = await fetch(`${apiBaseUrl}/api/health`, { method: 'GET' });
          if (res.ok) {
            const data = await res.json();
            if (data.gemini_configured) {
              setBackendStatus('connected');
              setBackendError(null);
              if (isManual) {
                setRecheckMessage(`✅ Connected to ${apiBaseUrl}! Google Gemini AI is ready.`);
                setTimeout(() => setRecheckMessage(''), 4000);
              }
            } else {
              setBackendStatus('missing_key');
              if (isManual) {
                setRecheckMessage('⚠️ Backend is online, but GEMINI_API_KEY in backend/.env is still empty.');
                setTimeout(() => setRecheckMessage(''), 5000);
              }
            }
          } else {
            setBackendStatus('offline');
            if (isManual) setRecheckMessage(`❌ Backend at ${apiBaseUrl} returned an error.`);
          }
        } catch (err) {
          setBackendStatus('offline');
          if (isManual) {
            setRecheckMessage(`❌ Could not connect to FastAPI backend at ${apiBaseUrl}.`);
            setTimeout(() => setRecheckMessage(''), 5000);
          }
        } finally {
          if (isManual) setIsRechecking(false);
        }
      };

      const handleSaveApiKey = async (e) => {
        e.preventDefault();
        const key = apiKeyInput.trim();
        if (!key || key.length < 10) {
          alert('Please enter a valid Gemini API key (at least 15 characters, typically starts with AIzaSy or AQ).');
          return;
        }

        setIsSavingKey(true);
        try {
          const res = await fetch(`${apiBaseUrl}/api/config/key`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key }),
          });

          if (res.ok) {
            setBackendStatus('connected');
            setBackendError(null);
            setApiKeyInput('');
            setRecheckMessage('✅ Gemini API key successfully saved and verified! You can now analyze jobs with live AI.');
            setTimeout(() => setRecheckMessage(''), 6000);
          } else {
            const err = await res.json().catch(() => ({}));
            alert('Failed to save key: ' + (err.detail || 'Unknown server error'));
          }
        } catch (err) {
          alert(`Failed to connect to backend server at ${apiBaseUrl}`);
        } finally {
          setIsSavingKey(false);
        }
      };

      useEffect(() => {
        checkBackendHealth(false);
      }, []);

      const clearAllHistory = () => {
        if (confirm('Delete all stored scan history on this machine?')) {
          setHistory([]);
          try {
            localStorage.removeItem('ai_fake_job_detector_history');
          } catch (e) {}
        }
      };

      const handleAnalyze = async (e) => {
        e.preventDefault();
        if (!formData.description || formData.description.trim().length < 15) {
          alert('Please enter at least 15 characters in the job description area.');
          return;
        }

        setIsAnalyzing(true);
        setBackendError(null);
        setLoadingStage(`Connecting to FastAPI backend at ${apiBaseUrl}...`);

        try {

                      </div>

                      <div className="flex-1 space-y-1 text-center sm:text-left">
                        <span className={`inline-block px-3 py-1 rounded text-xs font-bold uppercase tracking-wider border ${
                          currentReport.riskCategory === 'High' ? 'bg-rose-950/80 border-rose-500/50 text-rose-300' :
                          currentReport.riskCategory === 'Medium' ? 'bg-amber-950/80 border-amber-500/50 text-amber-300' :
                          'bg-emerald-950/80 border-emerald-500/50 text-emerald-300'
                        }`}>
                          {currentReport.riskLabel} ({currentReport.riskCategory} Category)
                        </span>
                        <p className="text-xs sm:text-sm text-slate-300 pt-1">
                          {currentReport.riskCategory === 'High' && 'Critical red flags identified. High likelihood of check overpayment scam, advance fee fraud, or credential harvesting.'}
                          {currentReport.riskCategory === 'Medium' && 'Several suspicious signals detected. Requires strict independent verification before sharing any data.'}
                          {currentReport.riskCategory === 'Low' && 'Posting aligns with conventional corporate hiring standards. No common scam triggers detected.'}
                        </p>
                      </div>
                    </div>

                    {/* Suspicious Phrases Detected */}
                    <div className="space-y-2">
                      <h4 className="text-xs font-mono uppercase tracking-wider text-slate-300 font-bold flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                        <span>Suspicious Phrases Detected ({currentReport.suspiciousPhrases.length})</span>
                      </h4>
                      {currentReport.suspiciousPhrases.length === 0 ? (
                        <div className="text-xs text-emerald-400 bg-emerald-950/30 border border-emerald-500/20 p-3 rounded-lg">
                          ✓ No textbook scam keyphrases triggered.
                        </div>
                      ) : (
                        <div className="flex flex-wrap gap-2">
                          {currentReport.suspiciousPhrases.map((p, i) => (
                            <span key={i} className="text-xs font-mono px-2.5 py-1 rounded bg-rose-950/60 border border-rose-500/40 text-rose-200">
                              "{p}"
                            </span>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* Reasons Behind Risk Assessment */}
                    <div className="space-y-3">
                      <h4 className="text-xs font-mono uppercase tracking-wider text-slate-300 font-bold flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
                        <span>Reasons Behind Risk Assessment ({currentReport.reasons.length})</span>
                      </h4>
                      <div className="space-y-2.5">
                        {currentReport.reasons.map((r, i) => (
                          <div key={i} className="p-3.5 rounded-lg bg-slate-950/60 border border-slate-800 space-y-1">
                            <div className="flex items-center gap-2">
                              <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 uppercase">
                                {r.category}
                              </span>
                              <span className="text-xs font-bold text-white">{r.title}</span>
                            </div>
                            <p className="text-xs text-slate-300 leading-relaxed">{r.description}</p>
                            {r.recommendation && (
                              <div className="text-xs text-amber-300 font-medium pt-1">
                                💡 Tip: {r.recommendation}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Safety Recommendations */}
                    <div className="space-y-3">
                      <h4 className="text-xs font-mono uppercase tracking-wider text-slate-300 font-bold flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span>Safety Recommendations</span>
                      </h4>
                      <div className="space-y-2">
                        {currentReport.safetyRecommendations.map((rec, i) => (
                          <div key={i} className="p-3 rounded-lg bg-slate-900/60 border border-slate-800 text-xs sm:text-sm text-slate-200 flex items-start gap-2">
                            <span className="text-[10px] font-mono font-bold text-cyan-400 uppercase mt-0.5">[{rec.priority}]</span>
                            <span>{rec.text}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Provenance note */}
                    <div className="pt-4 border-t border-slate-800 text-[11px] font-mono text-slate-400 flex justify-between">
                      <span>Engine: {currentReport.engineMode}</span>
                      <span>{new Date(currentReport.analyzedAt).toLocaleTimeString()}</span>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* HISTORY VIEW */}
            {activeTab === 'history' && (
              <div className="cyber-card p-6 sm:p-8 space-y-6">
                <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                  <div>
                    <h2 className="text-xl sm:text-2xl font-bold text-white">Scan History & Threat Reports</h2>
                    <p className="text-xs sm:text-sm text-slate-400">Locally saved threat reports on this browser.</p>
                  </div>
                  {history.length > 0 && (
                    <button
                      onClick={clearAllHistory}
                      className="text-xs px-3 py-1.5 rounded bg-rose-950/40 text-rose-300 border border-rose-800/50 hover:bg-rose-900/60"
                    >
                      Clear All History
                    </button>
                  )}
                </div>

                {history.length === 0 ? (
                  <div className="text-center py-12 text-slate-500 space-y-2">
                    <p className="text-sm">No analysis history recorded yet.</p>
                    <button
                      onClick={() => setActiveTab('scanner')}
                      className="px-4 py-2 rounded bg-cyan-400 text-slate-950 text-xs font-bold uppercase"
                    >
                      Scan First Job
                    </button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {history.map(item => (
                      <div key={item.id} className="p-4 rounded-xl bg-slate-950/60 border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded border ${
                              item.riskCategory === 'High' ? 'bg-rose-950/80 border-rose-500/50 text-rose-300' :
                              item.riskCategory === 'Medium' ? 'bg-amber-950/80 border-amber-500/50 text-amber-300' :
                              'bg-emerald-950/80 border-emerald-500/50 text-emerald-300'
                            }`}>
                              {item.riskCategory} Risk ({item.fraudScore}/100)
                            </span>
                            <span className="text-xs text-slate-400 font-mono">
                              {new Date(item.analyzedAt).toLocaleDateString()}
                            </span>
                          </div>
                          <h4 className="text-sm sm:text-base font-bold text-white mt-1">{item.jobTitle}</h4>
                          <p className="text-xs text-slate-400">Company: {item.company}</p>
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => {
                              setCurrentReport(item);
                              setActiveTab('scanner');
                              setIsSaved(true);
                            }}
                            className="text-xs px-3 py-1.5 rounded bg-cyan-950/50 text-cyan-300 border border-cyan-700/50 hover:bg-cyan-900/60"
                          >
                            View in Dashboard
                          </button>
                          <button
                            onClick={() => deleteHistoryItem(item.id)}
                            className="text-xs p-1.5 rounded text-slate-500 hover:text-rose-400"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* SCAM TACTICS TAB VIEW */}
            {activeTab === 'tactics' && (
              <div className="cyber-card p-6 sm:p-8 space-y-6">
                <div className="pb-4 border-b border-slate-800">
                  <h2 className="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
                    <span>🛡️</span>
                    <span>Common Scam Tactics & Red Flags</span>
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-400 mt-1">
                    Threat intelligence library on prevalent recruitment fraud, advance-fee schemes, and digital identity traps.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="p-4 rounded-xl bg-slate-900/80 border border-rose-500/30 space-y-2">
                    <div className="flex items-center gap-2 text-rose-400 font-bold text-sm">
                      <span>💸</span> Advance-Fee & Equipment Scams
                    </div>
                    <p className="text-xs text-slate-300">
                      Scammers send a fraudulent check for "home office equipment" or demand a mandatory "registration / verification / training fee" via UPI, Zelle, or Wire transfer. Real employers never charge candidates money to start working.
                    </p>
                    <div className="text-[11px] font-mono text-rose-300/80 bg-rose-950/40 p-2 rounded border border-rose-800/40">
                      Red Flag: "Deposit check to buy tools from our certified vendor" or "Pay ₹2,000 joining fee".
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-900/80 border border-amber-500/30 space-y-2">
                    <div className="flex items-center gap-2 text-amber-400 font-bold text-sm">
                      <span>📱</span> WhatsApp & Telegram Text Interviews
                    </div>
                    <p className="text-xs text-slate-300">
                      Scammers conduct "interviews" entirely over untraceable messaging apps to avoid voice/video verification and conceal fake corporate identities. Legitimate enterprises use domain emails and video conferencing.
                    </p>
                    <div className="text-[11px] font-mono text-amber-300/80 bg-amber-950/40 p-2 rounded border border-amber-800/40">
                      Red Flag: "Add recruiter on Telegram @company_hr for your 15-minute text screening."
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-900/80 border border-purple-500/30 space-y-2">
                    <div className="flex items-center gap-2 text-purple-400 font-bold text-sm">
                      <span>🪪</span> Premature PII & Identity Theft
                    </div>
                    <p className="text-xs text-slate-300">
                      Demanding copies of government IDs (Aadhaar, PAN, SSN, Passport) or bank account login details prior to a formal, legally verified employment contract and onboarding portal.
                    </p>
                    <div className="text-[11px] font-mono text-purple-300/80 bg-purple-950/40 p-2 rounded border border-purple-800/40">
                      Red Flag: "Send photos of driver's license front/back before we schedule your interview."
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-900/80 border border-cyan-500/30 space-y-2">
                    <div className="flex items-center gap-2 text-cyan-400 font-bold text-sm">
                      <span>📦</span> Package Mule & Reshipping Rings
                    </div>
                    <p className="text-xs text-slate-300">
                      Masked as "Quality Inspector" or "Logistics Coordinator", victims are asked to receive packages bought with stolen credit cards at their home address and re-ship them internationally.
                    </p>
                    <div className="text-[11px] font-mono text-cyan-300/80 bg-cyan-950/40 p-2 rounded border border-cyan-800/40">
                      Red Flag: "Receive packages at your address, repackage, and forward via prepaid label."
                    </div>
                  </div>
                </div>

                <div className="pt-2 text-center">
                  <button
                    onClick={() => setActiveTab('scanner')}
                    className="px-6 py-2.5 rounded-lg bg-cyan-400 text-slate-950 font-bold text-xs uppercase tracking-wider hover:bg-cyan-300 transition-colors cursor-pointer"
                  >
                    Return to Job Scanner
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Backend API Configuration Modal (Local vs Production Render/Vercel) */}
          {isApiSettingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="cyber-card p-6 sm:p-8 max-w-lg w-full space-y-4 border border-cyan-500/40 shadow-2xl">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <span>⚙️</span>
                    <span>Backend API Configuration</span>
                  </h3>
                  <button onClick={() => setIsApiSettingsOpen(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>
                <p className="text-xs text-slate-300">
                  Connect your frontend to your local FastAPI backend or your deployed production Render service URL.
                </p>
                <form onSubmit={handleSaveApiUrl} className="space-y-3">
                  <div>
                    <label className="block text-xs font-mono uppercase text-slate-400 mb-1">Backend Server Base URL</label>
                    <input
                      type="url"
                      value={apiUrlInput}
                      onChange={(e) => setApiUrlInput(e.target.value)}
                      placeholder="e.g. https://my-detector-backend.onrender.com"
                      className="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-cyan-300 font-mono text-xs focus:outline-none focus:border-cyan-400"
                      required
                    />
                  </div>
                  <div className="flex items-center gap-2 pt-2">
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold text-xs uppercase tracking-wider cursor-pointer transition-colors"
                    >
                      Save & Re-connect
                    </button>
                    <button
                      type="button"
                      onClick={handleResetApiUrl}
                      className="px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold cursor-pointer border border-slate-700"
                    >
                      Reset Local (:8000)
                    </button>
                  </div>
                </form>
                <div className="p-2.5 rounded bg-slate-900/90 border border-slate-800 text-[11px] font-mono text-slate-400 space-y-1">
                  <div>💡 <strong>Production (Render):</strong> Set your Render Web Service URL (e.g. <code className="text-cyan-300">https://your-service.onrender.com</code>).</div>
                  <div>💡 <strong>Vercel Link:</strong> You can also pass <code className="text-cyan-300">?api=https://your-service.onrender.com</code> directly in the browser address bar!</div>
                </div>
              </div>
            </div>
          )}

          {/* Security Tips Modal */}
          {isTipsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="cyber-card p-6 sm:p-8 max-w-2xl w-full max-h-[85vh] overflow-y-auto space-y-4 border border-slate-700">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="text-lg font-bold text-white">⚠️ Scam Tactics Checklist</h3>
                  <button onClick={() => setIsTipsOpen(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>
                <div className="space-y-3 text-xs text-slate-300">
                  <div className="p-3 rounded bg-slate-900 border border-slate-800">
                    <span className="font-bold text-rose-400">1. Fake Check & Equipment Vendors:</span> Recruiter sends a check to buy gear from their vendor. Check bounces days later; you lose the transferred money.
                  </div>
                  <div className="p-3 rounded bg-slate-900 border border-slate-800">
                    <span className="font-bold text-amber-400">2. Telegram / WhatsApp Text Interviews:</span> Legitimate companies use corporate email and verified video calls, never text-only messaging apps.
                  </div>
                  <div className="p-3 rounded bg-slate-900 border border-slate-800">
                    <span className="font-bold text-purple-400">3. Identity Theft:</span> Premature requests for Driver's license photos, SSN, or bank logins before any verified formal offer.
                  </div>
                  <div className="p-3 rounded bg-slate-900 border border-slate-800">
                    <span className="font-bold text-cyan-400">4. Unrealistic High Compensation:</span> Offering $65+/hour for entry-level data entry with zero experience.
                  </div>
                </div>
                <button
                  onClick={() => setIsTipsOpen(false)}
                  className="w-full py-2 rounded bg-cyan-400 text-slate-950 font-bold text-xs uppercase"
                >
                  Close Checklist
                </button>
              </div>
            </div>
          )}

          {/* How It Works */}
          <div className="max-w-5xl mx-auto px-4 py-12">
            <h2 className="text-2xl font-bold text-center mb-8 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400">How It Works</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6 text-center">
                <div className="text-3xl mb-3">📋</div>
                <h3 className="text-lg font-semibold text-cyan-300 mb-2">1. Paste Job Details</h3>
                <p className="text-sm text-slate-400">Enter the job title, company name, and the full job description text you received from the recruiter.</p>
              </div>
              <div className="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6 text-center">
                <div className="text-3xl mb-3">🤖</div>
                <h3 className="text-lg font-semibold text-cyan-300 mb-2">2. AI Analyzes Threats</h3>
                <p className="text-sm text-slate-400">Google Gemini AI scans for advance-fee scams, identity theft indicators, urgency tactics, and suspicious communication patterns.</p>
              </div>
              <div className="bg-slate-800/60 border border-slate-700/50 rounded-xl p-6 text-center">
                <div className="text-3xl mb-3">🛡️</div>
                <h3 className="text-lg font-semibold text-cyan-300 mb-2">3. Get Risk Report</h3>
                <p className="text-sm text-slate-400">Receive a detailed risk score (0-100), suspicious phrases, threat explanations, and personalized safety recommendations.</p>
              </div>
            </div>
          </div>

          {/* Footer */}
          <footer className="mt-auto border-t border-slate-800 py-6 text-center text-xs text-slate-400">
            <div className="max-w-7xl mx-auto px-4">
              AI Fake Job Detector • Cybersecurity Threat Defense System • Frontend Architecture Preview
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
